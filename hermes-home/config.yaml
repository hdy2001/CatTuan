# CatTuan 专用 Hermes 配置（HERMES_HOME=CatTuan/hermes-home），与 ~/.hermes 互不影响。

model:
  default: LongCat-2.5-Preview
  provider: longcat

# 按 LongCat 开放平台文档的 OpenAI 兼容方式接入；关闭思考，挑图场景要快。
providers:
  longcat:
    api: https://api.longcat.chat/openai/v1
    key_env: LONGCAT_API_KEY
    transport: chat_completions
    default_model: LongCat-2.5-Preview
    extra_body:
      thinking:
        type: disabled

agent:
  reasoning_effort: "none"

# idol_photo_search（图片搜索）+ official_account / official_photos（经沙箱读官方号）
plugins:
  enabled:
    - cattuan-bridge
    - deep-search
    - idol-photos
    - langfuse
    - ledger
    - official-accounts
    - site-builder
    - skill-store
  disabled: []

# App 只走 API server：搜图、识图、记忆、记账、技能、深度搜索、发布网页。不给终端/文件/浏览器/生图。
platform_toolsets:
  api_server: [idol, vision, memory, session_search, ledger, skills, skillstore, deepsearch, sites]

memory:
  memory_enabled: true
  user_profile_enabled: true
skills:
