<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#28925f">
  <meta name="referrer" content="no-referrer">
  <title>登录 · 喵团</title>
  <link rel="icon" href="longcat-icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body class="authpage">
  <!-- 登录：名字 + 密码。账号由管理员用 scripts/user.mjs 开通（调试用的注册接口是 /api/auth/register，页面上不放入口） -->
  <main class="auth">
    <div class="authbrand"><img src="longcat-icon.svg" alt=""><b>喵团</b></div>
    <p id="authSub" class="authsub">LongCat 个人助理</p>
    <form id="authForm" class="authform" novalidate>
      <label>名字<input id="name" name="username" autocomplete="username" maxlength="20" required></label>
      <label>密码<input id="password" name="password" type="password" autocomplete="current-password" required></label>
      <p id="authErr" class="autherr" role="alert" hidden></p>
      <button id="authBtn" type="submit">登录</button>
    </form>
    <p id="authNote" class="authnote">账号由管理员开通；忘了密码，找管理员重置。</p>
  </main>
  <script>
    const $ = (s) => document.querySelector(s);
    const err = (msg) => { $('#authErr').textContent = msg || ''; $('#authErr').hidden = !msg; };
    async function post(url, body) {
      const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || `出错了（${r.status}）`);
      return d;
    }

    // 已经登录了就直接进 App
    fetch('/api/auth/me').then((r) => { if (r.ok) location.replace('/'); }).catch(() => {});

    $('#authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      err('');
      const password = $('#password').value;
      if (!$('#name').value.trim() || !password) return err('名字和密码都要填');
      $('#authBtn').disabled = true;
      try {
        await post('/api/auth/login', { name: $('#name').value.trim(), password });
        location.replace('/');
      } catch (e2) {
        err(e2.message);
        $('#authBtn').disabled = false;
      }
    });
  </script>
</body>
</html>
