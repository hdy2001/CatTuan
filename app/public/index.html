<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#28925f">
  <meta name="referrer" content="no-referrer">
  <title>喵团 · LongCat 个人助理</title>
  <link rel="icon" href="longcat-icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- 顶栏：左边 ☰ 打开侧边栏（二级页面时变成 ‹ 返回），中间是当前聊天的标题和状态；右边留白让标题居中 -->
    <header class="top">
      <button type="button" id="topLeft" class="topbtn" aria-label="打开侧边栏">
        <svg class="i-menu" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg class="i-back" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="toptitle">
        <b id="topTitle">喵团</b>
        <!-- 状态：喵团（主 agent）正在做的那一步，比如「上网搜「…」」；没事做时显示在线 / 后台任务数 -->
        <div id="topStatus" class="status"><i id="dot"></i><span id="statusText">连接中…</span></div>
      </div>
      <span class="topbtn" aria-hidden="true"></span>
    </header>

    <main id="chatView" class="view">
      <div id="messages" class="messages" aria-live="polite"></div>
      <!-- 小电视悬浮窗：后台任务在跑时直播它在干什么，可以收起（见 ui/live.js renderTV） -->
      <div id="tv" class="tv" hidden></div>
      <form id="composer" class="composer">
        <!-- 演示入口：电话预约（Longcat 第一期 PRD）的交互演示（?mock=booking，假数据，不连服务端）；演示里变成「返回喵团」 -->
        <a id="demoBanner" class="demobanner" href="?mock=booking">
          <span class="dbicon" aria-hidden="true">📞</span>
          <span class="dbtext"><b>电话预约演示</b><small>PRD 交互演示 · 假数据，不打电话、不写数据</small></span>
          <em>进入 ›</em>
        </a>
        <div id="attachments" class="attachments"></div>
        <div class="row">
          <textarea id="input" rows="1" placeholder="想让我帮你做点什么？"></textarea>
          <button id="plus" class="plus" type="button" aria-label="更多工具" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7.5v9M7.5 12h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <button id="send" class="sendbtn" type="submit" hidden>发送</button>
        </div>
        <input id="fileInput" type="file" accept="image/*" multiple hidden>
        <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
        <div id="toolPanel" class="toolpanel" hidden>
          <button type="button" data-tool="album"><span class="ti">🖼️</span>相册</button>
          <button type="button" data-tool="camera"><span class="ti">📷</span>拍摄</button>
        </div>
      </form>
    </main>

    <!-- 目标（仿 Muse Goals）：「正在盯」每行是勾选框（= 完成）、标题和一句最新状态；下面是「新建目标」 -->
    <main id="goalsView" class="view" hidden>
      <div id="goals" class="glist"></div>
    </main>

    <main id="tasksView" class="view" hidden>
      <div class="viewhead">
        <div>
          <div class="viewsub">喵团派出去干活的执行 agent，关掉 App 也会继续</div>
        </div>
      </div>
      <!-- 仿 Muse：每行是类别图标（生活 / 工作 / 编程 / 社交）、标题、一句最新动态和时间，按今天 / 昨天分组；点一行弹出详情 -->
      <div id="tasks" class="tlist"></div>
    </main>

  </div>

  <!-- 侧边栏：搜索聊天记录、新建对话、目标、后台任务、按今天 / 昨天 / 更早分组的聊天记录 -->
  <div id="drawer" class="drawer" hidden>
    <div class="drawerwrap">
      <aside class="drawerbody" role="dialog" aria-label="侧边栏">
        <div class="dbrand"><img src="longcat-icon.svg" alt=""><b>喵团</b></div>
        <label class="dsearch">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input id="chatSearch" type="search" placeholder="搜索聊天记录" autocomplete="off">
        </label>
        <button type="button" class="dnew" data-chat-new>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>新建对话
        </button>
        <button type="button" class="drow" data-goto-view="goals">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>目标<span id="goalCount" class="dmeta"></span>
        </button>
        <button type="button" class="drow" data-goto-view="tasks">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7l1.5 1.5L8 6M4 13l1.5 1.5L8 12M11 7h9M11 13h9M11 19h9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>后台任务<b id="taskBadge" class="dbadge" hidden></b>
        </button>
        <div class="dsep"></div>
        <div class="dgroup">喵团档案</div>
        <button type="button" class="drow" data-open-viewer="id">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="9" cy="11" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 15.5c.8-1.4 1.8-2 3-2s2.2.6 3 2M14 10h4M14 13h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>身份证
        </button>
        <button type="button" class="drow" data-open-viewer="resume">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-10A.5.5 0 0 1 7 20z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M14 3.5V8h4M10 12h5M10 15.5h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>简历
        </button>
        <!-- 喵团的电话（仿 Cue：agent 有自己的电话）：点开是通话记录，再点一通看详情和转写。不显示号码，统一写「美团专线」 -->
        <button type="button" class="drow" data-open-calls>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 3.5h2.6l1.4 4.1-1.9 1.3a11.5 11.5 0 0 0 6.4 6.4l1.3-1.9 4.1 1.4v2.6a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4.6 5.7a2 2 0 0 1 2-2.2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>电话<span class="dmeta">美团专线</span>
        </button>
        <div class="dsep"></div>
        <!-- 聊天记录不常用：可以折叠，默认收起；搜索时自动展开显示结果 -->
        <button type="button" id="histToggle" class="dhist" aria-expanded="false" aria-controls="chatsList">
          <span>聊天记录</span><span id="chatCount" class="dmeta"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div id="chatsList" class="dchats" hidden></div>
        <!-- 当前账号：每个人的聊天、任务、目标都是自己的 -->
        <div class="dme"><span>已登录</span><b id="meName"></b><em id="meRole" hidden>管理员</em><button type="button" data-logout>退出</button></div>
      </aside>
    </div>
  </div>

  <!-- 目标详情（仿 Muse）：目标说明、ACTIVE（定时检查）、动态（按日期，检查的结论点开看那次检查的轨迹）；··· 里是现在检查 / 暂停 / 完成 / 删除 -->
  <div id="goalSheet" class="sheet tsheet" hidden>
    <div class="tsbody" role="dialog" aria-modal="true" aria-labelledby="gsTitle" tabindex="-1">
      <div class="tsgrab" aria-hidden="true"></div>
      <button type="button" class="tsclose tsmenubtn" data-goal-menu aria-label="更多操作" aria-haspopup="menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="18" cy="12" r="1.6" fill="currentColor"/></svg>
      </button>
      <button type="button" class="tsclose" data-close-goal aria-label="关闭">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div id="goalMenu" class="gmenu" role="menu" hidden></div>
      <div id="goalDetail" class="tsscroll"></div>
    </div>
  </div>

  <!-- 新建目标：一句话说想盯什么，下面是这一类的例子（点一下填进去） -->
  <div id="goalNewSheet" class="sheet" hidden>
    <div class="sheetbody" role="dialog" aria-labelledby="gnTitle">
      <header class="sheethead">
        <strong id="gnTitle">新建目标</strong>
        <button type="button" class="sheetclose" data-close-sheet aria-label="关闭">×</button>
      </header>
      <form id="goalNewForm" class="gnform">
        <textarea id="goalNewInput" rows="3" placeholder="想让喵团一直帮你盯着什么？说清楚盯什么、多久看一次"></textarea>
        <div id="goalNewIdeas" class="gnideas"></div>
        <button type="submit" class="gnsubmit">开始盯</button>
      </form>
      <div class="accsub">建好后喵团先查一次，以后按你说的频率接着查，有新进展才在聊天里告诉你。</div>
    </div>
  </div>

  <!-- 后台任务详情（仿 Muse）：状态、标题、最新动态，下面是 MAIN（喵团）和 SUBAGENT（执行 agent 每一轮）的轨迹；往下拖或点 ✕ 关掉 -->
  <div id="taskSheet" class="sheet tsheet" hidden>
    <div class="tsbody" role="dialog" aria-modal="true" aria-labelledby="tsTitle" tabindex="-1">
      <div class="tsgrab" aria-hidden="true"></div>
      <button type="button" class="tsclose" data-close-task aria-label="关闭">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div id="taskDetail" class="tsscroll"></div>
      <div id="taskFoot" class="tsfoot" hidden></div>
    </div>
  </div>

  <!-- 喵团身份证：照二代身份证的版式做的趣味卡片（不用官方模板、国徽和真实号码格式），点卡片翻面 -->
  <div id="idViewer" class="sitebrowser" hidden>
    <div class="sbwin" role="dialog" aria-label="喵团身份证">
      <header class="sbchrome">
        <button type="button" class="sbbtn" data-close-viewer aria-label="关闭">✕</button>
        <div class="sbaddr"><b>喵团身份证</b><small>点卡片翻面</small></div>
        <span class="sbbtn" aria-hidden="true"></span>
      </header>
      <div class="idstage"><button type="button" id="idCard" class="idcard" aria-label="喵团身份证，点一下翻面"></button></div>
    </div>
  </div>

  <!-- 喵团简历：固定 A4 尺寸的纸张（不随窗口重排），像看 PDF 一样拖动、缩放；数字来自 App 的真实数据（/api/profile） -->
  <div id="resumeViewer" class="sitebrowser" hidden>
    <div class="sbwin" role="dialog" aria-label="喵团简历">
      <header class="sbchrome">
        <button type="button" class="sbbtn" data-close-viewer aria-label="关闭">✕</button>
        <div class="sbaddr"><b>喵团的简历</b><small>拖动查看 · 双指或 ⌘/Ctrl + 滚轮缩放</small></div>
        <div class="pzctl">
          <button type="button" data-zoom="out" aria-label="缩小" title="缩小">−</button>
          <button type="button" data-zoom="fit" id="zoomLabel" aria-label="适合宽度" title="适合宽度">100%</button>
          <button type="button" data-zoom="in" aria-label="放大" title="放大">+</button>
        </div>
      </header>
      <div id="resumeView" class="pzview"><div id="resumeBody" class="pzstage resume"></div></div>
    </div>
  </div>

  <!-- 研究报告阅读页：聊天里只放报告卡片，点开在这里看全文 -->
  <div id="reportReader" class="sitebrowser" hidden>
    <div class="sbwin" role="dialog" aria-label="研究报告">
      <header class="sbchrome">
        <button type="button" class="sbbtn" data-rr="close" aria-label="关闭">✕</button>
        <div class="sbaddr"><b id="rrTitle"></b><small id="rrMeta"></small></div>
        <button type="button" class="sbbtn" data-rr="copy" aria-label="复制全文" title="复制全文">⧉</button>
      </header>
      <article id="rrBody" class="rrbody"></article>
    </div>
  </div>

  <div id="lightbox" class="lightbox" hidden>
    <img id="lightboxImg" alt="">
    <div class="lbactions">
      <a id="lightboxSave" class="save" download>保存图片</a>
      <a id="lightboxSource" class="source" target="_blank" rel="noopener noreferrer">来源</a>
    </div>
    <div class="credit">图片来自网络，版权归原作者，转发请注明来源</div>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
